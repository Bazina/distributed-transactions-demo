spring.application.name=accounting-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/accountingdb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Short so a blocked write shows up inside a lecture, not after it.
# MySQL default is 50 seconds.
demo.lock-wait-timeout-seconds=15

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-22logger{0} : %msg%n
logging.level.com.demo=INFO
demo.xa-branch=accounting
