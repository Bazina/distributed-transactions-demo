spring.application.name=booking-service
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bookingdb?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2

demo.payment-url=http://localhost:8081
demo.accounting-url=http://localhost:8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-22logger{0} : %msg%n
logging.level.com.demo=INFO
demo.xa-branch=booking
